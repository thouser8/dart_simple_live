# =============================================================================
#  My TV Build —— 你自己维护的 Android TV 打包流程
#
#  为什么用它：
#    这个文件在作者仓库里不存在，完全属于你自己。以后无论怎么点
#    "Sync fork" 同步上游更新，都不会跟它冲突，你不需要再手动改任何东西。
#    作者仓库里的 publish_tv_app_release.yaml 请忽略，不要再使用。
#
#  用法：
#    Actions → 左侧选 "My TV Build (用这个)" → Run workflow
#
#  需要的 4 个仓库密钥（Settings → Secrets and variables → Actions）：
#    TV_KEYSTORE_BASE64 / TV_STORE_PASSWORD / TV_KEY_PASSWORD / TV_KEY_ALIAS
#    这四个值在你本机的「密钥信息与填写清单.txt」里。
#
#  想改成自己的包名 / 显示名：见下面「应用自定义设置」那一步的两个值。
#    只需设置一次，之后永久生效 —— 因为同步上游永远不会动这个文件，
#    所以以后每次打包前都不需要再重新填写。
# =============================================================================
name: My TV Build (用这个)

# 只能手动触发，不会因为同步上游而自动乱跑
on:
  workflow_dispatch:

# 允许把安装包发布到本仓库的 Releases 页面
permissions:
  contents: write

# -----------------------------------------------------------------------------
#  代码来源 —— 本脚本每次运行都会"直接向作者仓库取最新代码"，
#  所以你不需要手动同步，也不会用到你自己仓库里那份旧代码。
#
#  为什么要这样：TV 版一直在作者的 dev 分支上开发，master 分支里的 TV 部分
#  自 2026 年 2 月起就不再更新了。而且 TV 工程用的是"路径依赖"
#  （simple_live_core: path: ../simple_live_core），TV 代码必须和同一分支的
#  core 代码配套，所以必须整棵分支一起取，不能只挑 TV 这个文件夹。
#
#    SOURCE_REF: dev      → 打包作者 dev 分支的 TV 版（最新功能，偶尔可能编译失败）
#    SOURCE_REF: master   → 打包作者 master 分支的 TV 版（较旧但稳定）
#
#  想切换时，把下面的 dev 改成 master（或改回来）保存即可，下次运行生效。
# -----------------------------------------------------------------------------
env:
  SOURCE_REPO: SlotSun/dart_simple_live
  SOURCE_REF: dev

jobs:
  build-tv:
    runs-on: macos-latest
    steps:
      - name: 1. 签出源码（自动取作者最新）
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}

      # -----------------------------------------------------------------------
      #  TV 图标修正 —— 必须在上游代码签出之后、编译之前执行
      #
      #  为什么需要：第 1 步签出的是「上游作者仓库」，不含本仓库对图标的修改。
      #  这里把 TCL 桌面判定「满幅图块」可能依赖的条件一次性补齐：
      #    ① 五档 16:9 横幅铺进 mipmap（xhdpi = 320x180，Android TV 官方基准）
      #    ② 同一张图再放一份到 drawable/banner（部分桌面按该名字读取）
      #    ③ 删除 adaptive-icon（它会把方图标塞进长方形）
      #    ④ 清单补 leanback / touchscreen 声明（TV 应用标志，当前上游没有）
      #    ⑤ versionCode +1，避免桌面沿用旧图标缓存
      # -----------------------------------------------------------------------
      - name: 1.5 应用 TV 图标修正
        run: |
          set -e
          trap 'echo "::error::第 1.5 步在第 $LINENO 行失败，请把上面几行日志发给我"' ERR
          BASE="https://raw.githubusercontent.com/thouser8/dart_simple_live/master/simple_live_tv_app/android/app/src/main/res"
          APP="simple_live_tv_app"
          RES="$APP/android/app/src/main/res"
          MF="$APP/android/app/src/main/AndroidManifest.xml"

          echo "① 铺五档 16:9 横幅"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$d"
            if ! curl -fsSL --retry 3 --retry-delay 2 "$BASE/mipmap-$d/ic_banner.png" -o "$RES/mipmap-$d/ic_banner.png"; then
              echo "::error::拉取 mipmap-$d/ic_banner.png 失败：本仓库 master 分支上该文件不存在。同步上游会用作者的原图覆盖它，需要重新上传一次横幅图片。"
              exit 1
            fi
            echo "   mipmap-$d/ic_banner.png  $(wc -c < "$RES/mipmap-$d/ic_banner.png") 字节"
          done

          echo "② 额外提供 drawable/banner"
          mkdir -p "$RES/drawable-xhdpi" "$RES/drawable-nodpi"
          cp "$RES/mipmap-xhdpi/ic_banner.png"   "$RES/drawable-xhdpi/banner.png"
          cp "$RES/mipmap-xxxhdpi/ic_banner.png" "$RES/drawable-nodpi/banner.png"
          echo "   drawable-xhdpi/banner.png + drawable-nodpi/banner.png"

          echo "③ 移除 adaptive-icon"
          rm -f "$RES/mipmap-anydpi-v26/ic_banner.xml"
          if [ -f "$RES/mipmap-anydpi-v26/ic_banner.xml" ]; then
            echo "::error::adaptive-icon 未能删除，桌面仍会把方图塞进长方形"
            exit 1
          fi

          echo "④ 清单：banner 指向 drawable/banner，并补 TV 声明"
          if ! command -v python3 >/dev/null 2>&1; then
            echo "::error::运行环境缺少 python3，无法修改清单"
            exit 1
          fi
          cat > /tmp/fix_manifest.py <<'PYEOF'
          import io, re, sys
          p = sys.argv[1]
          s = io.open(p, encoding="utf-8").read()
          hits = s.count('android:banner="@mipmap/ic_banner"')
          s = s.replace('android:banner="@mipmap/ic_banner"',
                        'android:banner="@drawable/banner"')
          added = False
          if "android.software.leanback" not in s:
              feats = ('<uses-feature android:name="android.software.leanback" android:required="false"/>\n'
                       '    <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>\n\n'
                       '    ')
              s, n = re.subn(r"<application", feats + "<application", s, count=1)
              added = n > 0
          io.open(p, "w", encoding="utf-8", newline="").write(s)
          print("   banner 属性改写 %d 处" % hits)
          print("   uses-feature 补充: %s" % ("是" if added else "已存在，跳过"))
          if hits == 0:
              sys.exit("清单里没有 android:banner=@mipmap/ic_banner 可改")
          PYEOF
          python3 /tmp/fix_manifest.py "$MF"

          echo "⑤ versionCode +1（破缓存）"
          cat > /tmp/bump_version.py <<'PYEOF'
          import io, re, sys
          p = sys.argv[1]
          s = io.open(p, encoding="utf-8").read()
          m = re.search(r"^version:[ \t]*([\d.]+)\+(\d+)[ \t]*$", s, re.M)
          if not m:
              sys.exit("pubspec.yaml 中未找到 version: X.Y.Z+N 形式")
          new = "version: %s+%d" % (m.group(1), int(m.group(2)) + 1)
          s = s[:m.start()] + new + s[m.end():]
          io.open(p, "w", encoding="utf-8", newline="").write(s)
          print("   %s  ->  %s" % (m.group(0), new))
          PYEOF
          python3 /tmp/bump_version.py "$APP/pubspec.yaml"

          echo "---- 结果校验 ----"
          grep -m3 'android:banner' "$MF" || true
          grep -m2 'uses-feature' "$MF" || true
          ls -l "$RES/drawable-xhdpi/banner.png" "$RES/drawable-nodpi/banner.png"


      - name: 2. 还原签名文件
        id: keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: keystore.jks
          encodedString: ${{ secrets.TV_KEYSTORE_BASE64 }}

      - name: 3. 写入 key.properties
        run: |
          echo "storeFile=${{ steps.keystore.outputs.filePath }}" > simple_live_tv_app/android/key.properties
          echo "storePassword=${{ secrets.TV_STORE_PASSWORD }}" >> simple_live_tv_app/android/key.properties
          echo "keyPassword=${{ secrets.TV_KEY_PASSWORD }}" >> simple_live_tv_app/android/key.properties
          echo "keyAlias=${{ secrets.TV_KEY_ALIAS }}" >> simple_live_tv_app/android/key.properties

      # -----------------------------------------------------------------------
      #  自定义设置 —— 只需要在这里设置一次，之后永久生效。
      #
      #   APP_ID_SUFFIX：
      #      留空 ""  = 不改包名，装上去会直接覆盖官方版（与原版同包名）。
      #      填 ".my"  = 在原包名后追加 .my，可与官方版同时安装共存
      #                 （App 内数据从零开始，需重新登录）。
      #
      #   APP_LABEL：
      #      留空 ""  = 电视桌面上的名字保持 "Simple Live TV"。
      #      填中文  = 改成你想要的名字，便于区分两个版本。
      #
      #  注意：值要用英文双引号包起来，引号内不要有多余空格。
      #
      #  防重复机制：本步骤会「先把末尾可能已经存在的同名后缀去掉，再追加一次」，
      #  因此无论源文件里原本是什么状态，最终包名都只会带一个后缀，不会出现
      #  .my.my 这种叠加；同时会在日志里打印最终包名供核对。
      # -----------------------------------------------------------------------
      - name: 4. 应用自定义设置
        env:
          APP_ID_SUFFIX: ".my"
          APP_LABEL: "Simple Live TV 自建版"
        run: |
          cd simple_live_tv_app
          if [ -n "$APP_ID_SUFFIX" ]; then
            perl -pi -e 's{(applicationId = ")([^"]*)(")}{my $v=$2; my $s=$ENV{APP_ID_SUFFIX}; $v=~s/(?:\Q$s\E)+\z//; $1.$v.$s.$3}e' android/app/build.gradle.kts
            VALUE=$(sed -n 's/^[[:space:]]*applicationId = "\(.*\)"[[:space:]]*$/\1/p' android/app/build.gradle.kts | head -1)
            echo "最终包名：${VALUE:-（未找到）}"
            if [ -z "$VALUE" ]; then
              echo "错误：未找到 applicationId，已主动停止"
              exit 1
            fi
            case "$VALUE" in
              *"$APP_ID_SUFFIX") echo "后缀核对无误（只追加了一次）" ;;
              *) echo "错误：包名不以 $APP_ID_SUFFIX 结尾，已主动停止（不产出可能装错的安装包）"
                 exit 1 ;;
            esac
          else
            echo "包名保持原样（未做修改）"
          fi
          if [ -n "$APP_LABEL" ]; then
            perl -pi -e 's{android:label="[^"]*"}{android:label="$ENV{APP_LABEL}"}' android/app/src/main/AndroidManifest.xml
            VALUE=$(sed -n 's/.*android:label="\(.*\)".*/\1/p' android/app/src/main/AndroidManifest.xml | head -1)
            echo "最终显示名：${VALUE:-（未找到）}"
            if [ "$VALUE" != "$APP_LABEL" ]; then
              echo "错误：显示名未能按预期修改，已主动停止"
              exit 1
            fi
          else
            echo "显示名保持原样（未做修改）"
          fi

      - name: 5. 设置 Java 环境
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: 6. 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: simple_live_tv_app/pubspec.yaml
          cache: true

      - name: 7. 安装依赖
        run: |
          cd simple_live_tv_app
          flutter pub get

      - name: 8. 编译 APK
        run: |
          cd simple_live_tv_app
          flutter build apk --release --split-per-abi

      - name: 9. 保存到 Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android_tv
          path: |
            simple_live_tv_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: 10. 读取版本号
        id: version
        uses: juliangruber/read-file-action@v1
        with:
          path: assets/tv_app_version.json

      - name: 11. 发布到 Releases
        uses: softprops/action-gh-release@v3
        with:
          repository: ${{ github.repository }}
          tag_name: "tv_v${{ fromJson(steps.version.outputs.content).version }}"
          name: "TV ${{ fromJson(steps.version.outputs.content).version }}"
          body: |
            # Android TV
            ${{ fromJson(steps.version.outputs.content).version_desc }}
          prerelease: ${{ fromJson(steps.version.outputs.content).prerelease }}
          overwrite_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            simple_live_tv_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
